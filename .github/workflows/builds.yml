name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the plugin
        run: mvn -B package
      - name: Save the jar so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: CustomLockItem
          path: target/*.jar
